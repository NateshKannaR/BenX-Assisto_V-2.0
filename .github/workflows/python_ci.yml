name: Python checks

on: [push, pull_request]

jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q benx.py benx_tui.py jarvis_ai src
      - run: python -m unittest -v test_benx test_web
      - run: python benx.py --doctor

  gtk-imports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python -m unittest -v test_benx.TestUIComponents
