name: Build BenX APK

on:
  push:
    paths:
      - 'benx_flutter/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Get dependencies
        working-directory: benx_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: benx_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: benx-release-apk
          path: benx_flutter/build/app/outputs/flutter-apk/app-release.apk
