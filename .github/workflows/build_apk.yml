name: Build BenX APK

on:
  push:
    paths:
      - 'benx_flutter/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    paths:
      - 'benx_flutter/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benx_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: benx-companion-apk
          path: benx_flutter/build/app/outputs/flutter-apk/app-release.apk
